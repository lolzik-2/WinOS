name: Build WinOS firmware

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      SKETCH_DIR: .
      FQBN: esp32:esp32:esp32s3
      BOARD_OPTIONS: "CDCOnBoot=cdc,PSRAM=disabled,FlashMode=qio,FlashSize=8M,PartitionScheme=default"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Configure core and libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.5
          arduino-cli lib install "M5Unified" "M5GFX" "M5Cardputer"

      - name: Compile sketch
        run: |
          arduino-cli compile \
            --fqbn "$FQBN:$BOARD_OPTIONS" \
            --output-dir build \
            "$SKETCH_DIR"

      - name: Install esptool
        run: pip install esptool

      - name: Merge into one firmware file
        run: |
          BOOT_APP0=$(find ~/.arduino15 -name boot_app0.bin | head -n 1)
          echo "boot_app0: $BOOT_APP0"
          mkdir -p artifacts
          esptool.py --chip esp32s3 merge_bin \
            --output artifacts/WinOS-full.bin \
            --flash_mode qio --flash_freq 80m --flash_size 8MB \
            0x0     build/WinOS.ino.bootloader.bin \
            0x8000  build/WinOS.ino.partitions.bin \
            0xe000  "$BOOT_APP0" \
            0x10000 build/WinOS.ino.bin

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: WinOS-firmware
          path: artifacts/WinOS-full.bin
