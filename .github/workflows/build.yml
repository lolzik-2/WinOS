name: Build Cardputer firmware

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      SKETCH_DIR: Cardputer-OS
      FQBN: esp32:esp32:esp32s3
      BOARD_OPTIONS: "CDCOnBoot=cdc,PSRAM=disabled,FlashMode=qio,FlashSize=8M,PartitionScheme=default"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Configure core and libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.5
          arduino-cli lib install "M5Unified" "M5GFX" "M5Cardputer"

      - name: Compile sketch
        run: |
          arduino-cli compile \
            --fqbn "$FQBN:$BOARD_OPTIONS" \
            --output-dir build \
            "$SKETCH_DIR"

      - name: Rename firmware
        run: |
          mkdir -p artifacts
          cp build/*.bin artifacts/Cardputer-OS.bin

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: Cardputer-OS-firmware
          path: artifacts/Cardputer-OS.bin
